<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1424" />
    <title>Flight path not found | Air New Zealand PTFS</title>
    <link rel="icon" type="image/jpeg" href="koru-logo.jpeg" sizes="512x512" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1424; color: #f4f8fc; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: radial-gradient(ellipse at 50% 25%, #183b55, transparent 38rem), #0b1424; }
      main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px); border: 1px solid rgba(197,216,236,.16); border-radius: 24px; background: rgba(20,36,58,.84); text-align: center; box-shadow: 0 28px 80px rgba(0,0,0,.25); }
      .mark { color: #65d0cb; font-size: 2rem; }
      p { margin: 14px 0 25px; color: #a9b8cb; line-height: 1.7; }
      a { display: inline-flex; min-height: 46px; align-items: center; gap: 12px; padding: 0 17px; border-radius: 12px; color: #09202c; background: #65d0cb; font-size: .82rem; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #f6a15f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">✦</span>
      <h1>Looks like we missed a turn.</h1>
      <p>This flight path doesn’t exist. Head back to the Air New Zealand PTFS homepage to get back on course.</p>
      <a href="./">Back to home <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
