<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080c" />
    <title>Flight path not found | Air New Zealand PTFS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08080c; color: #f4f1f7; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: radial-gradient(ellipse at 50% 25%, #382447, transparent 38rem), #08080c; }
      main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px); border: 1px solid rgba(227,215,238,.18); background: rgba(27,23,33,.8); text-align: center; }
      .mark { color: #b28bd1; font-size: 2rem; }
      p { margin: 14px 0 25px; color: #bdb5c6; line-height: 1.7; }
      a { display: inline-flex; min-height: 46px; align-items: center; gap: 12px; padding: 0 17px; color: #120d16; background: #b28bd1; font-size: .82rem; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">✦</span>
      <h1>Looks like we missed a turn.</h1>
      <p>This flight path doesn’t exist. Head back to the Air New Zealand PTFS homepage to get back on course.</p>
      <a href="./">Back to home <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
